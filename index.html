  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8F7F4;
      color: #30251F;

    h1, h2, h3, .font-display {

      body * { visibility: hidden; }

      #area-cetak-struk {
        position: fixed;
        left: 0;

        box-shadow: none !important;

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Komponen Ikon Lucide Ringan
    const Icon = ({ name, size = 18, className = "" }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconEl = document.createElement('i');
          iconEl.setAttribute('data-lucide', name);
          iconEl.style.width = `${size}px`;
          iconEl.style.height = `${size}px`;
          if (className) iconEl.setAttribute('class', className);
          ref.current.appendChild(iconEl);
          window.lucide.createIcons({ nodes: [iconEl] });
        }
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    };

    const formatRupiah = (angka) => {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0,
      }).format(angka || 0);
    };

    const DATA_AWAL = {
      profilUsaha: {
        nama: 'Bubur Ayam Spesial Nusantara',
        alamat: 'Jl. Kartini No. 45, Kejaksan, Kota Cirebon',
        telepon: '0812-3456-7890',
        catatanStruk: 'Terima kasih atas kunjungan Anda! Selamat menikmati.',
      },
      produk: [
        { id: 'PRD-01', kode: 'BBR-01', nama: 'Bubur Ayam Original', kategori: 'Menu Utama', harga: 13000, aktif: true, ikon: '🥣' },
        { id: 'PRD-02', kode: 'TOP-01', nama: 'Sate Ampela', kategori: 'Topping & Sate', harga: 2000, aktif: true, ikon: '🍢' },
        { id: 'PRD-03', kode: 'TOP-02', nama: 'Sate Ati', kategori: 'Topping & Sate', harga: 2000, aktif: true, ikon: '🍢' },
        { id: 'PRD-04', kode: 'TOP-03', nama: 'Sate Usus', kategori: 'Topping & Sate', harga: 2000, aktif: true, ikon: '🍢' },
        { id: 'PRD-05', kode: 'TOP-04', nama: 'Telur Puyuh', kategori: 'Topping & Sate', harga: 2000, aktif: true, ikon: '🥚' },
        { id: 'PRD-06', kode: 'MIN-01', nama: 'Es Teh Manis', kategori: 'Minuman', harga: 4000, aktif: true, ikon: '🧊' },
        { id: 'PRD-07', kode: 'MIN-02', nama: 'Teh Tawar Hangat', kategori: 'Minuman', harga: 2000, aktif: true, ikon: '🍵' },
      ],
      bahanBaku: [
        { id: 'BHN-01', nama: 'Beras Pulen', kategori: 'Bahan Pokok', stok: 25000, satuan: 'gram', minimum: 5000, hargaBeli: 15000, jumlahBeli: 1000, satuanBeli: 'kg' },
        { id: 'BHN-02', nama: 'Daging Ayam Fillet', kategori: 'Protein', stok: 8500, satuan: 'gram', minimum: 2000, hargaBeli: 38000, jumlahBeli: 1000, satuanBeli: 'kg' },
        { id: 'BHN-03', nama: 'Ampela Ayam', kategori: 'Protein', stok: 45, satuan: 'tusuk', minimum: 15, hargaBeli: 1000, jumlahBeli: 1, satuanBeli: 'tusuk' },
        { id: 'BHN-04', nama: 'Ati Ayam', kategori: 'Protein', stok: 40, satuan: 'tusuk', minimum: 15, hargaBeli: 1000, jumlahBeli: 1, satuanBeli: 'tusuk' },
        { id: 'BHN-05', nama: 'Usus Ayam', kategori: 'Protein', stok: 12, satuan: 'tusuk', minimum: 15, hargaBeli: 900, jumlahBeli: 1, satuanBeli: 'tusuk' },
        { id: 'BHN-06', nama: 'Telur Puyuh', kategori: 'Protein', stok: 60, satuan: 'butir', minimum: 20, hargaBeli: 450, jumlahBeli: 1, satuanBeli: 'butir' },
        { id: 'BHN-07', nama: 'Kerupuk & Kacang Kedelai', kategori: 'Pelengkap', stok: 4200, satuan: 'gram', minimum: 1000, hargaBeli: 22000, jumlahBeli: 1000, satuanBeli: 'kg' },
        { id: 'BHN-08', nama: 'Minyak Goreng & Bumbu Kuning', kategori: 'Bumbu', stok: 3500, satuan: 'ml', minimum: 1000, hargaBeli: 18000, jumlahBeli: 1000, satuanBeli: 'liter' },
      ],
      resep: {
        'PRD-01': [
          { bahanId: 'BHN-01', jumlah: 100 },
          { bahanId: 'BHN-02', jumlah: 45 },
          { bahanId: 'BHN-07', jumlah: 25 },
          { bahanId: 'BHN-08', jumlah: 15 },
        ],
        'PRD-02': [{ bahanId: 'BHN-03', jumlah: 1 }],
        'PRD-03': [{ bahanId: 'BHN-04', jumlah: 1 }],
        'PRD-04': [{ bahanId: 'BHN-05', jumlah: 1 }],
        'PRD-05': [{ bahanId: 'BHN-06', jumlah: 2 }],
      },
      transaksi: [
        {
          id: 'TRX-20261120-001',
          waktu: '20 Nov 2026, 07:15',
          tanggal: '2026-11-20',
          items: [
            { id: 'PRD-01', nama: 'Bubur Ayam Original', qty: 2, harga: 13000, hpp: 4030 },
            { id: 'PRD-02', nama: 'Sate Ampela', qty: 2, harga: 2000, hpp: 1000 },
          ],
          total: 30000,
          totalHpp: 10060,
          metode: 'Tunai',
          dibayar: 50000,
          kembalian: 20000,
          status: 'Selesai',
          catatan: '',
        },
        {
          id: 'TRX-20261120-002',
          waktu: '20 Nov 2026, 08:02',
          tanggal: '2026-11-20',
          items: [
            { id: 'PRD-01', nama: 'Bubur Ayam Original', qty: 3, harga: 13000, hpp: 4030 },
            { id: 'PRD-04', nama: 'Sate Usus', qty: 2, harga: 2000, hpp: 900 },
            { id: 'PRD-05', nama: 'Telur Puyuh', qty: 2, harga: 2000, hpp: 900 },
          ],
          total: 47000,
          totalHpp: 15690,
          metode: 'QRIS',
          dibayar: 47000,
          kembalian: 0,
          status: 'Selesai',
          catatan: '',
        },
      ],
      pengeluaran: [
        { id: 'EXP-01', tanggal: '2026-11-20', kategori: 'Gas', keterangan: 'Isi ulang Tabung Gas LPG 12 kg', jumlah: 215000, metode: 'Tunai' },
        { id: 'EXP-02', tanggal: '2026-11-19', kategori: 'Listrik', keterangan: 'Token Listrik Warung', jumlah: 150000, metode: 'Transfer' },
        { id: 'EXP-03', tanggal: '2026-11-18', kategori: 'Gaji pegawai', keterangan: 'Uang harian 2 karyawan dapur & kasir', jumlah: 300000, metode: 'Tunai' },
      ],
      riwayatStok: [
        { id: 'LOG-01', waktu: '20 Nov 2026, 06:00', bahan: 'Beras Pulen', tipe: 'Stok Masuk', perubahan: '+10.000 gram', keterangan: 'Belanja pasar pagi' },
        { id: 'LOG-02', waktu: '20 Nov 2026, 08:02', bahan: 'Daging Ayam Fillet', tipe: 'Penjualan POS', perubahan: '-135 gram', keterangan: 'Transaksi TRX-20261120-002' },
      ],
    };

    function App() {
      const [data, setData] = useState(() => {
        try {
          const tersimpan = localStorage.getItem('bubur_ayam_pos_v1');
          return tersimpan ? JSON.parse(tersimpan) : DATA_AWAL;
        } catch {
          return DATA_AWAL;
        }
      });

      const [menuAktif, setMenuAktif] = useState('ringkasan');
      const [sidebarCiut, setSidebarCiut] = useState(false);
      const [sidebarMobile, setSidebarMobile] = useState(false);
      const [pencarianGlobal, setPencarianGlobal] = useState('');
      const [notifikasiToast, setNotifikasiToast] = useState(null);

      // State Kasir
      const [keranjang, setKeranjang] = useState([]);
      const [cariProdukKasir, setCariProdukKasir] = useState('');
      const [kategoriKasir, setKategoriKasir] = useState('Semua');
      const [metodeBayar, setMetodeBayar] = useState('Tunai');
      const [uangDiterima, setUangDiterima] = useState('');
      const [strukAktif, setStrukAktif] = useState(null);
      const [lebarStruk, setLebarStruk] = useState('58mm');

      // State Filter & Modal
      const [periodeDashboard, setPeriodeDashboard] = useState('Hari ini');
      const [filterRiwayat, setFilterRiwayat] = useState('');
      const [modalBatal, setModalBatal] = useState(null);
      const [alasanBatal, setAlasanBatal] = useState('');

      // State Form Produk, Stok, Resep, Pengeluaran
      const [modalProduk, setModalProduk] = useState(null);
      const [modalStok, setModalStok] = useState(null);
      const [produkResepDipilih, setProdukResepDipilih] = useState('PRD-01');
      const [formPengeluaran, setFormPengeluaran] = useState({
        tanggal: '2026-11-20',
        kategori: 'Gas',
        keterangan: '',
        jumlah: '',
        metode: 'Tunai',
      });

      useEffect(() => {
        try {
          localStorage.setItem('bubur_ayam_pos_v1', JSON.stringify(data));
        } catch (e) {}
      }, [data]);

      const tampilkanPesan = (teks, tipe = 'sukses') => {
        setNotifikasiToast({ teks, tipe });
        setTimeout(() => setNotifikasiToast(null), 3500);
      };

      const resetDataDemo = () => {
        setData(DATA_AWAL);
        setKeranjang([]);
        localStorage.removeItem('bubur_ayam_pos_v1');
        tampilkanPesan('Data demo berhasil dikembalikan ke pengaturan awal.');
      };

      // Hitung HPP Produk secara akurat
      const hitungHppProduk = (produkId) => {
        const daftarBahan = data.resep[produkId] || [];
        return daftarBahan.reduce((total, item) => {
          const bahan = data.bahanBaku.find((b) => b.id === item.bahanId);
          if (!bahan) return total;
          const hargaPerUnit = bahan.hargaBeli / bahan.jumlahBeli;
          return total + hargaPerUnit * item.jumlah;
        }, 0);
      };

      // Hitung estimasi porsi tersedia berdasarkan stok bahan baku
      const cekKetersediaanPorsi = (produkId) => {
        const daftarBahan = data.resep[produkId];
        if (!daftarBahan || daftarBahan.length === 0) return 999;
        let maksPorsi = Infinity;
        daftarBahan.forEach((item) => {
          const bahan = data.bahanBaku.find((b) => b.id === item.bahanId);
          if (!bahan) {
            maksPorsi = 0;
          } else {
            const porsiBisa = Math.floor(bahan.stok / item.jumlah);
            if (porsiBisa < maksPorsi) maksPorsi = porsiBisa;
          }
        });
        return maksPorsi === Infinity ? 999 : maksPorsi;
      };

      // Kalkulasi Ringkasan Keuangan
      const ringkasanKeuangan = useMemo(() => {
        const trxSelesai = data.transaksi.filter((t) => t.status === 'Selesai');
        const totalOmzet = trxSelesai.reduce((s, t) => s + t.total, 0);
        const totalHpp = trxSelesai.reduce((s, t) => s + (t.totalHpp || 0), 0);
        const labaKotor = totalOmzet - totalHpp;
        const totalBiayaOperasional = data.pengeluaran.reduce((s, p) => s + Number(p.jumlah || 0), 0);
        const labaBersih = labaKotor - totalBiayaOperasional;
        const jumlahTransaksi = trxSelesai.length;
        const jumlahPorsi = trxSelesai.reduce(
          (s, t) => s + t.items.reduce((acc, i) => acc + i.qty, 0),
          0
        );
        const rataRataTransaksi = jumlahTransaksi > 0 ? totalOmzet / jumlahTransaksi : 0;
        const marginKeuntungan = totalOmzet > 0 ? ((labaBersih / totalOmzet) * 100).toFixed(1) : 0;

        return {
          totalOmzet,
          totalHpp,
          labaKotor,
          totalBiayaOperasional,
          labaBersih,
          jumlahTransaksi,
          jumlahPorsi,
          rataRataTransaksi,
          marginKeuntungan,
        };
      }, [data.transaksi, data.pengeluaran]);

      // Fungsi Kasir
      const tambahKeKeranjang = (produk) => {
        if (!produk.aktif) return;
        const stokTersedia = cekKetersediaanPorsi(produk.id);
        const diKeranjang = keranjang.find((k) => k.id === produk.id)?.qty || 0;
        if (diKeranjang + 1 > stokTersedia) {
          tampilkanPesan(`Stok bahan baku untuk ${produk.nama} tidak mencukupi!`, 'gagal');
          return;
        }
        setKeranjang((prev) => {
          const ada = prev.find((item) => item.id === produk.id);
          if (ada) {
            return prev.map((item) =>
              item.id === produk.id ? { ...item, qty: item.qty + 1 } : item
            );
          }
          return [...prev, { ...produk, qty: 1 }];
        });
      };

      const ubahQtyKeranjang = (id, delta) => {
        setKeranjang((prev) =>
          prev
            .map((item) => {
              if (item.id !== id) return item;
              const qtyBaru = item.qty + delta;
              if (delta > 0 && qtyBaru > cekKetersediaanPorsi(id)) {
                tampilkanPesan('Batas stok bahan baku tercapai.', 'gagal');
                return item;
              }
              return { ...item, qty: qtyBaru };
            })
            .filter((item) => item.qty > 0)
        );
      };

      const totalKeranjang = keranjang.reduce((sum, i) => sum + i.harga * i.qty, 0);
      const nominalDibayar =
        metodeBayar === 'Tunai' ? Number(uangDiterima || 0) : totalKeranjang;
      const kembalian = metodeBayar === 'Tunai' ? nominalDibayar - totalKeranjang : 0;

      const prosesPembayaran = () => {
        if (keranjang.length === 0) {
          tampilkanPesan('Keranjang pesanan masih kosong.', 'gagal');
          return;
        }
        if (metodeBayar === 'Tunai' && nominalDibayar < totalKeranjang) {
          tampilkanPesan('Uang yang diterima kurang dari total pesanan.', 'gagal');
          return;
        }

        const nomorTrx = `TRX-20261120-${String(data.transaksi.length + 1).padStart(3, '0')}`;
        const sekarang = new Date().toLocaleString('id-ID', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });

        const itemDenganHpp = keranjang.map((item) => ({
          id: item.id,
          nama: item.nama,
          qty: item.qty,
          harga: item.harga,
          hpp: Math.round(hitungHppProduk(item.id)),
        }));

        const totalHppTrx = itemDenganHpp.reduce((s, i) => s + i.hpp * i.qty, 0);

        const transaksiBaru = {
          id: nomorTrx,
          waktu: sekarang,
          tanggal: '2026-11-20',
          items: itemDenganHpp,
          total: totalKeranjang,
          totalHpp: totalHppTrx,
          metode: metodeBayar,
          dibayar: nominalDibayar,
          kembalian: kembalian > 0 ? kembalian : 0,
          status: 'Selesai',
          catatan: '',
        };

        // Potong stok bahan baku otomatis sesuai resep
        const bahanTerbaru = [...data.bahanBaku];
        const logBaru = [];

        keranjang.forEach((item) => {
          const resepItem = data.resep[item.id] || [];
          resepItem.forEach((r) => {
            const idx = bahanTerbaru.findIndex((b) => b.id === r.bahanId);
            if (idx !== -1) {
              const pengurangan = r.jumlah * item.qty;
              bahanTerbaru[idx] = {
                ...bahanTerbaru[idx],
                stok: Math.max(0, bahanTerbaru[idx].stok - pengurangan),
              };
              logBaru.push({
                id: `LOG-${Date.now()}-${idx}`,
                waktu: sekarang,
                bahan: bahanTerbaru[idx].nama,
                tipe: 'Penjualan POS',
                perubahan: `-${pengurangan} ${bahanTerbaru[idx].satuan}`,
                keterangan: `Transaksi ${nomorTrx}`,
              });
            }
          });
        });

        setData((prev) => ({
          ...prev,
          transaksi: [transaksiBaru, ...prev.transaksi],
          bahanBaku: bahanTerbaru,
          riwayatStok: [...logBaru, ...prev.riwayatStok],
        }));

        setStrukAktif(transaksiBaru);
        setKeranjang([]);
        setUangDiterima('');
        tampilkanPesan(`Pembayaran ${nomorTrx} berhasil diproses!`);
      };

      // Ekspor CSV / Excel Laporan Keuangan
      const eksporLaporanCSV = () => {
        const baris = [
          ['Laporan Keuangan - BUBUR AYAM POS'],
          ['Periode', periodeDashboard],
          [''],
          ['Keterangan', 'Nilai (Rp)'],
          ['Total Omzet', ringkasanKeuangan.totalOmzet],
          ['Total HPP', ringkasanKeuangan.totalHpp],
          ['Laba Kotor', ringkasanKeuangan.labaKotor],
          ['Total Biaya Operasional', ringkasanKeuangan.totalBiayaOperasional],
          ['Laba Bersih', ringkasanKeuangan.labaBersih],
          ['Margin Keuntungan (%)', `${ringkasanKeuangan.marginKeuntungan}%`],
        ];
        const csvContent = 'data:text/csv;charset=utf-8,' + baris.map((e) => e.join(',')).join('\n');
        const link = document.createElement('a');
        link.setAttribute('href', encodeURI(csvContent));
        link.setAttribute('download', `Laporan_Keuangan_Bubur_Ayam_POS.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        tampilkanPesan('Laporan Excel (CSV) berhasil diunduh.');
      };

      const navigasiMenu = [
        {
          grup: 'DASHBOARD',
          items: [{ id: 'ringkasan', label: 'Ringkasan Bisnis', ikon: 'layout-dashboard' }],
        },
        {
          grup: 'TRANSAKSI',
          items: [
            { id: 'kasir', label: 'Kasir', ikon: 'calculator' },
            { id: 'riwayat', label: 'Riwayat Transaksi', ikon: 'receipt-text' },
          ],
        },
        {
          grup: 'OPERASIONAL',
          items: [
            { id: 'produk', label: 'Produk dan Menu', ikon: 'utensils' },
            { id: 'persediaan', label: 'Persediaan Bahan Baku', ikon: 'package' },
            { id: 'resep', label: 'Resep dan HPP', ikon: 'chef-hat' },
            { id: 'pengeluaran', label: 'Pengeluaran', ikon: 'wallet' },
          ],
        },
        {
          grup: 'ANALISIS BISNIS',
          items: [
            { id: 'laporan', label: 'Laporan Keuangan', ikon: 'bar-chart-3' },
            { id: 'kalender', label: 'Kalender Bisnis', ikon: 'calendar-days' },
          ],
        },
        {
          grup: 'PENGATURAN',
          items: [{ id: 'pengaturan', label: 'Pengaturan Usaha', ikon: 'settings' }],
        },
      ];

      const bahanHampirHabis = data.bahanBaku.filter((b) => b.stok <= b.minimum);

      return (
        <div className="min-h-screen flex bg-[#F8F7F4] text-[#30251F]">
          {/* Notifikasi Toast */}
          {notifikasiToast && (
            <div
              className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg border flex items-center gap-2.5 text-sm font-medium transition-all ${
                notifikasiToast.tipe === 'gagal'
                  ? 'bg-[#C65E58] text-white border-[#a84944]'
                  : 'bg-[#30251F] text-white border-[#554034]'
              }`}
            >
              <Icon name={notifikasiToast.tipe === 'gagal' ? 'alert-circle' : 'check-circle-2'} size={18} />
              <span>{notifikasiToast.teks}</span>
            </div>
          )}

          {/* Sidebar Desktop */}
          <aside
            className={`hidden lg:flex flex-col bg-white border-r border-[#D7C3A5]/40 transition-all duration-300 shrink-0 ${
              sidebarCiut ? 'w-20' : 'w-68'
            }`}
            style={{ width: sidebarCiut ? '80px' : '272px' }}
          >
            <div className="h-18 px-5 py-4 border-b border-[#F2EFE9] flex items-center justify-between">
              <div className="flex items-center gap-3 overflow-hidden">
                <div className="w-10 h-10 rounded-xl bg-[#30251F] text-[#D7C3A5] flex items-center justify-center font-bold text-lg shrink-0">
                  🥣
                </div>
                {!sidebarCiut && (
                  <div className="truncate">
                    <div className="font-display font-bold text-sm tracking-tight text-[#30251F]">
                      BUBUR AYAM POS
                    </div>
                    <div className="text-[11px] text-[#554034]/75">Sistem Manajemen Bisnis</div>
                  </div>
                )}
              </div>
              <button
                onClick={() => setSidebarCiut(!sidebarCiut)}
                className="p-1.5 rounded-lg hover:bg-[#F2EFE9] text-[#554034]"
                title="Ubah ukuran menu samping"
              >
                <Icon name={sidebarCiut ? 'panel-left-open' : 'panel-left-close'} size={16} />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto py-4 px-3 space-y-5">
              {navigasiMenu.map((kelompok) => (

                      <div key={idx} className="flex justify-between">
                        <span>{item.nama} x{item.qty}</span>
                        <span>{formatRupiah(item.harga * item.qty)}</span>
                      </div>
                    ))}
                  </div>
                  <div className="pt-2 space-y-1">
                    <div className="flex justify-between font-bold">
                      <span>TOTAL</span>
                      <span>{formatRupiah(strukAktif.total)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>DIBAYAR</span>
                      <span>{formatRupiah(strukAktif.dibayar)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>KEMBALIAN</span>
                      <span>{formatRupiah(strukAktif.kembalian)}</span>
                    </div>
                  </div>
                  <div className="text-center border-t border-dashed border-gray-400 mt-3 pt-2 text-[11px]">
                    {data.profilUsaha.catatanStruk}
                  </div>
                </div>

                <button
                  onClick={() => window.print()}
                  className="w-full py-2.5 rounded-xl bg-[#30251F] text-white font-semibold text-xs flex items-center justify-center gap-2"
                >
                  <Icon name="printer" size={16} />
                  <span>Cetak Struk Sekarang</span>
                </button>
              </div>
            </div>
          )}

          {/* MODAL PEMBATALAN TRANSAKSI */}
          {modalBatal && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-base">Batalkan Transaksi {modalBatal}</h3>
                <textarea
                  rows="3"
                  value={alasanBatal}
                  onChange={(e) => setAlasanBatal(e.target.value)}
                  placeholder="Tuliskan alasan pembatalan transaksi..."
                  className="w-full p-2.5 rounded-xl border border-[#D7C3A5] text-xs"
                />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setModalBatal(null)} className="px-3 py-2 rounded-xl text-xs bg-[#F2EFE9]">Batal</button>
                  <button
                    onClick={() => {
                      if (!alasanBatal.trim()) {
                        tampilkanPesan('Alasan pembatalan wajib diisi.', 'gagal');
                        return;
                      }
                      setData((prev) => ({
                        ...prev,
                        transaksi: prev.transaksi.map((t) =>
                          t.id === modalBatal ? { ...t, status: 'Dibatalkan', catatan: alasanBatal } : t
                        ),
                      }));
                      setModalBatal(null);
                      setAlasanBatal('');
                      tampilkanPesan('Transaksi telah dibatalkan.');
                    }}
                    className="px-3 py-2 rounded-xl text-xs bg-[#C65E58] text-white font-semibold"
                  >
                    Konfirmasi Pembatalan
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL PRODUK */}
          {modalProduk && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-base">Form Produk & Menu</h3>
                <input
                  type="text"
                  placeholder="Nama Produk"
                  value={modalProduk.nama}
                  onChange={(e) => setModalProduk({ ...modalProduk, nama: e.target.value })}
                  className="w-full p-2.5 rounded-xl border text-xs"
                />
                <select
                  value={modalProduk.kategori}
                  onChange={(e) => setModalProduk({ ...modalProduk, kategori: e.target.value })}
                  className="w-full p-2.5 rounded-xl border text-xs"
                >
                  <option value="Menu Utama">Menu Utama</option>
                  <option value="Topping & Sate">Topping & Sate</option>
                  <option value="Minuman">Minuman</option>
                </select>
                <input
                  type="number"
                  placeholder="Harga Jual (Rp)"
                  value={modalProduk.harga}
                  onChange={(e) => setModalProduk({ ...modalProduk, harga: Number(e.target.value) })}
                  className="w-full p-2.5 rounded-xl border text-xs"
                />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setModalProduk(null)} className="px-3 py-2 rounded-xl text-xs bg-[#F2EFE9]">Batal</button>
                  <button
                    onClick={() => {
                      if (!modalProduk.nama) return;
                      setData((prev) => {
                        const ada = prev.produk.some((p) => p.id === modalProduk.id);
                        return {
                          ...prev,
                          produk: ada
                            ? prev.produk.map((p) => (p.id === modalProduk.id ? modalProduk : p))
                            : [...prev.produk, modalProduk],
                        };
                      });
                      setModalProduk(null);
                      tampilkanPesan('Data produk berhasil disimpan.');
                    }}
                    className="px-3 py-2 rounded-xl text-xs bg-[#30251F] text-white font-semibold"
                  >
                    Simpan Produk
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL PENYESUAIAN STOK */}
          {modalStok && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-base">Penyesuaian Stok: {modalStok.bahan.nama}</h3>
                <div className="flex gap-2">
                  <button
                    onClick={() => setModalStok({ ...modalStok, tipe: 'masuk' })}
                    className={`flex-1 py-2 rounded-xl text-xs font-semibold ${modalStok.tipe === 'masuk' ? 'bg-[#43836A] text-white' : 'bg-[#F2EFE9]'}`}
                  >
                    Stok Masuk (+)
                  </button>
                  <button
                    onClick={() => setModalStok({ ...modalStok, tipe: 'keluar' })}
                    className={`flex-1 py-2 rounded-xl text-xs font-semibold ${modalStok.tipe === 'keluar' ? 'bg-[#C65E58] text-white' : 'bg-[#F2EFE9]'}`}
                  >
                    Stok Keluar (-)
                  </button>
                </div>
                <input
                  type="number"
                  placeholder={`Jumlah (${modalStok.bahan.satuan})`}
                  value={modalStok.jumlah}
                  onChange={(e) => setModalStok({ ...modalStok, jumlah: e.target.value })}
                  className="w-full p-2.5 rounded-xl border text-xs"
                />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setModalStok(null)} className="px-3 py-2 rounded-xl text-xs bg-[#F2EFE9]">Batal</button>
                  <button
                    onClick={() => {
                      const jml = Number(modalStok.jumlah);
                      if (!jml || jml <= 0) return;
                      setData((prev) => ({
                        ...prev,
                        bahanBaku: prev.bahanBaku.map((b) =>
                          b.id === modalStok.bahan.id
                            ? {
                                ...b,
                                stok:
                                  modalStok.tipe === 'masuk'
                                    ? b.stok + jml
                                    : Math.max(0, b.stok - jml),
                              }
                            : b
                        ),
                      }));
                      setModalStok(null);
                      tampilkanPesan('Stok bahan baku berhasil diperbarui.');
                    }}
                    className="px-3 py-2 rounded-xl text-xs bg-[#30251F] text-white font-semibold"
                  >
                    Simpan Stok
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
